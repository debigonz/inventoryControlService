spring:
  application:
    name: ms-api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        - id: users-service
          uri: lb://ms-users
          predicates:
            - Path=/users/**
        - id: products-service
          uri: lb://ms-products
          predicates:
            - Path=/products/**
        - id: inventory-service
          uri: lb://ms-inventories
          predicates:
            - Path=/inventories/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
server:
  port: 8090

eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    healthcheck:
      enabled: true
  instance:
    preferIpAddress: true
    status-page-url-path: /actuator/info
    health-check-url-path: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  info:
    env:
      enabled: true