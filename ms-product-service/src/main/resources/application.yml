spring:
  application:
    name: ms-products
  security:
    oauth2:
      resource server:
        jwt:
          issuer-uri: http://localhost:8081
  datasource:
    url: jdbc:mysql://localhost:3306/inventory_database?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
    database: MYSQL

server:
  port: 8083

eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    preferIpAddress: true