spring:
  application:
    name: ms-inventories
  security:
    oauth2:
      resource server:
        jwt:
          issuer-uri: http://localhost:8081
  datasource:
    url: jdbc:mysql://localhost:3306/inventory_database?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
    database: MYSQL

server:
  port: 8084

ms-products:
    url: http://localhost:8083

eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    healthcheck:
      enabled: true
  instance:
    preferIpAddress: true
    status-page-url-path: /actuator/info
    health-check-url-path: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  info:
    env:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.openfeign: DEBUG
    com.inventory.msapigateway: DEBUG
